<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Week 2 Day 1 - Advanced CSS</title>
  <link rel="stylesheet" href="advanced_styles.css" />
</head>
<body>

  <!-- Sticky Navigation with Theme Switcher -->
  <header class="sticky-nav">
    <div class="logo">DevUI</div>
    <nav>
      <a href="#spinners">Loaders</a>
      <a href="#content">Content</a>
      <a href="#footer">Footer</a>
    </nav>
    <button id="theme-toggle" class="theme-btn">Toggle Theme</button>
  </header>

  <main>
    <!-- CSS-only Animated Loader & Progress Bar -->
    <section id="spinners" class="section">
      <h2 class="section-title">Animated Loaders</h2>
      
      <div class="card">
        <h3>Spinner</h3>
        <div class="spinner"></div>
      </div>

      <div class="card">
        <h3>Progress Bar</h3>
        <div class="progress-track">
          <div class="progress-bar"></div>
        </div>
      </div>
    </section>

    <!-- Pseudo-elements Section -->
    <section id="content" class="section">
      <h2 class="section-title">Decorative Elements</h2>
      <blockquote class="quote-card">
        Clean CSS architecture scales better than excessive JavaScript manipulation.
      </blockquote>
    </section>

    <section id="footer" class="section spacer">
      <h2>Scroll Target Section</h2>
      <p>Smooth scrolling lands cleanly here.</p>
    </section>
  </main>

  <script>
    const toggleBtn = document.getElementById('theme-toggle');
    toggleBtn.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      document.documentElement.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
    });
  </script>
</body>
</html>
