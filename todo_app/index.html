<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dynamic To-Do List</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 480px;
      margin: 40px auto;
      padding: 0 16px;
    }
    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      flex: 1;
      padding: 8px 12px;
      font-size: 14px;
    }
    button {
      padding: 8px 16px;
      cursor: pointer;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-bottom: 1px solid #ddd;
    }
    .completed {
      text-decoration: line-through;
      color: #888;
    }
    .actions {
      display: flex;
      gap: 6px;
    }
  </style>
</head>
<body>
  <h2>My To-Do List</h2>
  <div class="input-group">
    <input type="text" id="todo-input" placeholder="Add a new task..." />
    <button id="add-btn">Add Task</button>
  </div>
  <ul id="todo-list"></ul>

  <script src="script.js"></script>
</body>
</html>
